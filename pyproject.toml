[project]
name = "career-navigator-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "N", "ASYNC", "A", "SIM", "RUF"
]
ignore = [
  # FastAPI often uses Depends(...) which can look like non-idiomatic patterns to some rulesets.
]
exclude = [
  ".venv",
  "alembic",
  "__pycache__",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
"
